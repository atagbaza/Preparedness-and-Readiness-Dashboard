  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

═════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-off      <h1 style=\"margin:4px 0 6px; font-size:40px;\">Priority action tracker<\u002Fh1>\n            <p style=\"margin:0; font-size:14px; line-height:1.55; color:var(--color-neutral-800);\">Tracks whether priority actions from the previous assessment are being carried out. Export them to seed the mitigation and contingency plan.<\u002Fp>\n            <p style=\"margin:6px 0 0; font-size:12px; color:oklch(0.45 0.13 28);\">Prototype: starting statuses, owners and due dates are illustrative.<\u002Fp>\n          <\u002Fdiv>\n          <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onExport }}\" data-noprint=\"1\">Export to contingency plan (CSV)<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px;\">\n          <sc-for list=\"{{ tr.stats }}\" as=\"ts\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ ts.onClick }}\" class=\"blueprint\" style=\"padding:14px 16px; display:flex; flex-direction:column; gap:6px; text-align:left; cursor:pointer; background:{{ ts.bg }}; color:var(--color-text);\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:{{ ts.ink }};\">{{ ts.label }}<\u002Fspan>\n              <span style=\"font-family:var(--font-heading); font-weight:600; font-size:38px; line-height:1;\">{{ ts.n }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div data-noprint=\"1\" style=\"display:flex; flex-wrap:wrap; gap:10px; align-items:center;\">\n          <sc-if value=\"{{ isRegion }}\" hint-placeholder-val=\"{{ true }}\">\n            <sc-raw-select class=\"input\" value=\"{{ tCountry }}\" sc-camel-on-change=\"{{ onTCountry }}\" style=\"width:auto; min-height:32px; padding:4px 8px; font-size:13px;\">\n                 <sc-raw-td style=\"font-size:13px; line-height:1.45; max-width:460px;\">{{ t.action }}<\u002Fsc-raw-td>\n                  <sc-if value=\"{{ isRegion }}\" hint-placeholder-val=\"{{ true }}\"><sc-raw-td style=\"font-size:13px; white-space:nowrap;\">{{ t.country }}<\u002Fsc-raw-td><\u002Fsc-if>\n                  <sc-raw-td style=\"font-size:13px;\">{{ t.pillar }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:13px;\">{{ t.owner }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:13px; white-space:nowrap; color:{{ t.dueInk }};\">{{ t.due }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:11px; color:var(--color-neutral-700); white-space:nowrap;\">{{ t.src }}<\u002Fsc-raw-td>\n                  <sc-raw-td>\n                    <sc-raw-select value=\"{{ t.st }}\" sc-camel-on-change=\"{{ t.onStatus }}\" style=\"border:1px solid {{ t.ink }}; background:{{ t.tint }}; color:{{ t.ink }}; padding:4px 6px; font-size:12px; width:100%;\">\n                      <option value=\"todo\">Not started<\u002Foption>\n                      <option value=\"progress\">In progress<\u002Foption>\n                      <option value=\"blocked\">Blocked<\u002Foption>\n                      <option value=\"done\">Implemented<\u002Foption>\n                    <\u002Fsc-raw-select>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEvidence }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Evidence repository\" style=\"display:flex; flex-direction:column; gap:20px;\">\n        <div style=\"max-width:760px;\">\n          <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-accent-700);\">Evidence repository · {{ evRound }}<\u002Fspan>\n          <h1 style=\"margin:4px 0 6px; font-size:40px;\">{{ ev.country }}: supporting evidence<\u002Fh1>\n          <p style=\"margin:0; font-size:14px; line-height:1.55; color:var(--color-neutral-800);\">Capacities reported as “Yes” that can be backed by a document, such as plans, SOPs, guidelines, rosters or MoUs. Countries upload the files and the regional team verifies them.<\u002Fp>\n          <p style=\"margin:6px 0 0; font-size:12px; color:oklch(0.45 0.13 28);\">Prototype: document statuses are illustrative.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px;\">\n          <sc-for list=\"{{ ev.stats }}\" as=\"es\" hint-placeholder-count=\"4\">\n            <div class=\"blueprint\" style=\"padding:14px 16px; display:flex; flex-direction:column; gap:6px;\">\n              <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n              <span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:{{ es.ink }};\">{{ es.label }}<\u002Fspan>\n              <span style=\"font-family:var(--font-heading); font-weight:600; font-size:38px; line-height:1;\">{{ es.n }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"overflow-x:auto;\">\n          <sc-raw-table class=\"table\" style=\"min-width:880px;\">\n            <sc-raw-thead><sc-raw-tr><sc-raw-th style=\"width:60px;\">S/N<\u002Fsc-raw-th><sc-raw-th>Reported capacity<\u002Fsc-raw-th><sc-raw-th>Pillar<\u002Fsc-raw-th><sc-raw-th>Document<\u002Fsc-raw-th><sc-raw-th style=\"width:110px;\">Status<\u002Fsc-raw-th><sc-raw-th style=\"width:170px;\"><\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ ev.rows }}\" as=\"e\" hint-placeholder-count=\"8\">\n                <sc-raw-tr>\n                  <sc-raw-td style=\"font-size:12px; color:var(--color-neutral-600);\">{{ e.sn }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:13px; line-height:1.4; max-width:440px;\">{{ e.text }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:13px; white-space:nowrap;\">{{ e.pillar }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"font-size:12px;\"><span style=\"display:block;\">{{ e.file }}<\u002Fspan><span style=\"color:var(--color-neutral-600);\">{{ e.date }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td><span style=\"font-size:11px; padding:2px 8px; background:{{ e.tint }}; color:{{ e.ink }}; white-space:nowrap;\">{{ e.stLabel }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td>\n                    <div style=\"display:flex; gap:6px; justify-content:flex-end;\">\n                      <sc-if value=\"{{ e.canUpload }}\" hint-placeholder-val=\"{{ false }}\"><button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ e.onUpload }}\" style=\"font-size:12px; padding:4px 10px;\">{{ e.upLabel }}<\u002Fbutton><\u002Fsc-if>\n                      <sc-if value=\"{{ e.canReview }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ e.onVerify }}\" style=\"font-size:12px; padding:4px 10px;\">Verify<\u002Fbutton>\n                        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ e.onReject }}\" style=\"font-size:12px; padding:4px 10px;\">Reject<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n        <\u002Fdiv>\n        <input type=\"file\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none;\">\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isReport }}\" hint-placeholder-val=\"{{ false }}\">\n      <section data-screen-label=\"Country report\" style=\"display:flex; flex-direction:column; gap:16px; align-items:center;\">\n        <div data-noprint=\"1\" style=\"display:flex; flex-wrap:wrap; gap:8px; width:100%; max-width:900px; align-items:center;\">\n          <div style=\"display:flex; flex-direction:column; gap:4px; margin-right:auto;\">\n            <span style=\"font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--color-neutral-700);\">Report type<\u002Fspan>\n            <div style=\"display:flex; border:1px solid var(--color-divider);\">\n              <sc-for list=\"{{ rtOpts }}\" as=\"rt\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ rt.onClick }}\" style=\"border:0; padding:8px 14px; font-size:13px; cursor:pointer; white-space:nowrap; background:{{ rt.bg }}; color:{{ rt.ink }};\">{{ rt.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"font-size:12px; color:var(--color-neutral-700); max-width:340px; line-height:1.4;\">{{ rtNote }}<\u002Fspan>\n          <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onPrint }}\">{{ pdfLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n        <div data-noprint=\"1\" class=\"blueprint\" style=\"width:100%; max-width:900px; padding:16px 18px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px;\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"display:flex; flex-direction:column; gap:3px; margin-right:auto; min-width:260px; flex:1 1 320px;\">\n            <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-accent-700);\">Summary presentation<\u002Fspan>\n            <span style=\"font-family:var(--font-heading); font-weight:600; font-size:20px;\">Generate a PowerPoint from the current data<\u002Fspan>\n            <span style=\"font-size:13px; color:var(--color-neutral-700); line-height:1.45;\">Capacities, gaps, anticipatory actions by time horizon, and tracker progress, for {{ roundLabel }}. The slides are editable.<\u002Fspan>\n            <sc-if value=\"{{ pptMsgOn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-size:12px; color:{{ pptMsgInk }};\">{{ pptMsg }}<\u002Fspan><\u002Fsc-if>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:8px;\">\n            <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ onPptCountry }}\" disabled=\"{{ pptBusy }}\">{{ pptCountryLabel }}<\u002Fbutton>\n            <sc-if value=\"{{ isRegion }}\" hint-placeholder-val=\"{{ true }}\">\n              <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ onPptRegion }}\" disabled=\"{{ pptBusy }}\">Regional summary (.pptx)<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <article style=\"width:100%; max-width:900px; background:#fbfbfc; border:1px solid var(--color-divider); padding:48px clamp(20px, 5vw, 56px); display:flex; flex-direction:column; gap:22px; position:relative; overflow:hidden;\">\n          <sc-if value=\"{{ isDemo }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; z-index:0;\"><span style=\"transform:rotate(-30deg); font-family:var(--font-heading); font-weight:600; font-size:clamp(48px, 9vw, 96px); letter-spacing:0.08em; color:oklch(0.45 0.13 28); opacity:0.12; white-space:nowrap;\">DUMMY TEST DATA<\u002Fspan><\u002Fdiv>\n            <div style=\"border:2px solid oklch(0.45 0.13 28); color:oklch(0.38 0.12 28); padding:8px 12px; font-size:12px; font-weight:600; letter-spacing:0.04em;\">NOT FOR CIRCULATION: this report uses simulated 2026 data for testing only.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-accent-700);\">\n            <span>WHO African Region · {{ hazardName }} preparedness and readiness<\u002Fspan><span>{{ roundLabel }}<\u002Fspan>\n          <\u002Fdiv>\n          <h1 style=\"margin:0; font-size:44px;\">{{ rp.country }}<\u002Fh1>\n          <h4 style=\"margin:-12px 0 0; font-weight:400; color:var(--color-neutral-700);\">{{ rp.subtitle }}<\u002Fh4>\n          <p style=\"margin:0; font-size:14px; line-height:1.65; text-wrap:pretty;\">{{ rp.intro }}<\u002Fp>\n          <div style=\"display:flex; flex-wrap:wrap; gap:24px; align-items:baseline; border-top:1px solid var(--color-divider); border-bottom:1px solid var(--color-divider); padding:14px 0;\">\n            <span style=\"font-size:13px;\">Overall <strong style=\"font-family:var(--font-heading); font-size:28px; margin-left:6px;\">{{ rp.ovTxt }}<\u002Fstrong><\u002Fspan>\n            <span style=\"font-size:13px;\">Capacity <strong style=\"font-weight:600;\">{{ rp.band }}<\u002Fstrong><\u002Fspan>\n            <span style=\"font-size:13px;\">{{ rp.counts }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(62px, 1fr)); gap:2px;\">\n            <sc-for list=\"{{ rp.strip }}\" as=\"s\" hint-placeholder-count=\"12\">\n              <div style=\"background:{{ s.tint }}; color:{{ s.ink }}; padding:8px 4px; text-align:center; display:flex; flex-direction:column; gap:2px;\">\n                <span style=\"font-size:10px; line-height:1.2;\">{{ s.short }}<\u002Fspan>\n                <span style=\"font-family:var(--font-heading); font-weight:600; font-size:18px;\">{{ s.txt }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-raw-table style=\"border-collapse:collapse; width:100%; font-size:13px;\">\n            <sc-raw-thead><sc-raw-tr>\n              <sc-raw-th style=\"text-align:left; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;\">Pillar<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; width:60px;\">Score<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:right; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; width:70px;\">{{ rp.deltaHead }}<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; width:96px;\">Capacity<\u002Fsc-raw-th>\n              <sc-raw-th style=\"text-align:left; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;\">Priority actions<\u002Fsc-raw-th>\n            <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n            <sc-raw-tbody>\n              <sc-for list=\"{{ rp.rows }}\" as=\"row\" hint-placeholder-count=\"12\">\n                <sc-raw-tr style=\"break-inside:avoid;\">\n                  <sc-raw-td style=\"padding:10px 6px; vertical-align:top; border-bottom:1px solid var(--color-divider); font-weight:500;\">{{ row.num }}. {{ row.name }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 6px; vertical-align:top; border-bottom:1px solid var(--color-divider); text-align:right; font-family:var(--font-heading); font-weight:600; font-size:16px;\">{{ row.scoreTxt }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 6px; vertical-align:top; border-bottom:1px solid var(--color-divider); text-align:right; color:{{ row.dInk }};\">{{ row.dTxt }}<\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 6px; vertical-align:top; border-bottom:1px solid var(--color-divider);\"><span style=\"font-size:11px; padding:2px 6px; background:{{ row.tint }}; color:{{ row.ink }};\">{{ row.band }}<\u002Fspan><\u002Fsc-raw-td>\n                  <sc-raw-td style=\"padding:10px 6px; vertical-align:top; border-bottom:1px solid var(--color-divider);\">\n                    <ul style=\"margin:0; padding-left:16px; display:flex; flex-direction:column; gap:3px; line-height:1.45;\">\n                      <sc-for list=\"{{ row.actions }}\" as=\"x\" hint-placeholder-count=\"1\"><li>{{ x }}<\u002Fli><\u002Fsc-for>\n                    <\u002Ful>\n                  <\u002Fsc-raw-td>\n                <\u002Fsc-raw-tr>\n              <\u002Fsc-for>\n            <\u002Fsc-raw-tbody>\n          <\u002Fsc-raw-table>\n          <span style=\"font-size:11px; color:var(--color-neutral-600);\">Capacity bands: Adequate ≥80% · Moderate 50–79% · Limited below 50%. Scores are the share of readiness criteria met per pillar. Overall is the weighted share of all scored criteria met, as in the source workbook.<\u002Fspan>\n          <sc-if value=\"{{ isDetailed }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"break-before:page; display:flex; flex-direction:column; gap:8px; padding-top:18px; border-top:2px solid var(--color-text);\">\n              <span style=\"font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--color-accent-700);\">Annex · Submitted responses<\u002Fspan>\n              <h2 style=\"margin:0; font-size:30px;\">Question-by-question assessment responses<\u002Fh2>\n              <p style=\"margin:0; font-size:13px; line-height:1.55; color:var(--color-neutral-800); text-wrap:pretty;\">{{ rp.annexIntro }}<\u002Fp>\n            <\u002Fdiv>\n            <sc-for list=\"{{ rp.detail }}\" as=\"dp\" hint-placeholder-count=\"3\">\n              <div style=\"display:flex; flex-direction:column; gap:6px;\">\n                <div style=\"display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 14px; break-after:avoid;\">\n                  <h4 style=\"margin:0; margin-right:auto; font-size:19px;\">{{ dp.title }}<\u002Fh4>\n                  <span style=\"font-size:12px; color:var(--color-neutral-700);\">{{ dp.meta }}<\u002Fspan>\n                  <span style=\"font-size:11px; padding:2px 8px; background:{{ dp.tint }}; color:{{ dp.ink }};\">{{ dp.band }}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-raw-table style=\"border-collapse:collapse; width:100%; font-size:12px;\">\n                  <sc-raw-thead><sc-raw-tr>\n                    <sc-raw-th style=\"text-align:left; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; width:52px;\">S/N<\u002Fsc-raw-th>\n                    <sc-raw-th style=\"text-align:left; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase;\">Readiness criterion<\u002Fsc-raw-th>\n                    <sc-if value=\"{{ rp.hasPrev }}\" hint-placeholder-val=\"{{ false }}\"><sc-raw-th style=\"text-align:center; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; width:78px;\">{{ rp.prevHead }}<\u002Fsc-raw-th><\u002Fsc-if>\n                    <sc-raw-th style=\"text-align:center; padding:8px 6px; border-bottom:2px solid var(--color-text); font-size:11px; letter-spacing:0.06em; text-transform:uppercase; width:92px;\">{{ rp.curHead }}<\u002Fsc-raw-th>\n                  <\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n                  <sc-raw-tbody>\n                    <sc-for list=\"{{ dp.qs }}\" as=\"q\" hint-placeholder-count=\"4\">\n                      <sc-raw-tr style=\"break-inside:avoid;\">\n                        <sc-raw-td style=\"padding:7px 6px; vertical-align:top; border-bottom:1px solid var(--color-divider); color:var(--color-neutral-600);\">{{ q.sn }}<\u002Fsc-raw-td>\n                        <sc-raw-td style=\"padding:7px 6px; vertical-align:top; border-bottom:1px solid var(--color- FRO emergency preparedness advisor. Hazard: ' + H.name + '. Country: ' + c.name + '. Readiness pillar: ' + P.name + ' (score ' + sc + '%).\\nUnmet readiness criteria:\\n' + gaps.map(g => '- ' + g.sn + ' ' + g.text).join('\\n') + '\\nExisting recommended actions (do not repeat):\\n' + (have.map(a => '- ' + a).join('\\n') || '- none') + '\\nPropose 3 additional specific, time-bound anticipatory actions (max 28 words each) the Ministry of Health and partners can take to close these gaps before the next ' + H.name.toLowerCase() + ' outbreak. Respond ONLY with a JSON array of strings.';\n    const parse = txt => { const m = String(txt).match(/\\[[\\s\\S]*\\]/); return (m ? JSON.parse(m[0]) : []).filter(x => typeof x === 'string'); };\n    const offline = () => {\n      const lib = (H.lib[p] || []).filter(a => !have.includes(a)).slice(0, 3);\n      const tmpl = gaps.filter(g => !have.some(h => h.includes(g.sn))).slice(0, 3 - lib.length).map(g => 'Close gap ' + g.sn + ' within the next quarter: ' + g.text.replace(/^(Country |There is |Availability of )/i, '').replace(/\\.$/, '') + ', with a named lead and progress review at the next readiness meeting.');\n      return [...lib, ...tmpl];\n    };\n    try {\n      let arr, src = 'AI draft', note = null; const apiKey = this.state.apiKey;\n      if (window.claude && window.claude.complete) arr = parse(await window.claude.complete(prompt));\n      else if (apiKey) {\n        const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 800, messages: [{ role: 'user', content: prompt }] }) });\n        if (!r.ok) throw new Error('AI service error ' + r.status + (r.status === 401 ? ' (check API key)' : ''));\n        const j = await r.json(); arr = parse(j.content && j.content[0] && j.content[0
