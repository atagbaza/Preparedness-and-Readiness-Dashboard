name: Build dashboard data

on:
  pull_request:
    paths: ['data/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['data/**', 'scripts/**']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # On every pull request: validate, rebuild src/data/pdx-data.js and commit it to the PR branch,
  # so the merged PR already contains the updated dashboard data (works with protected main).
  pr-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Validate and rebuild data
        run: node scripts/build-data.js
      - name: Post validation report on the PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: data/build/validation-report.md
      - name: Commit rebuilt data to the PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "pdx-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/pdx-data.js data/build/validation-report.md
          if git diff --cached --quiet; then echo "Data already up to date"; else git commit -m "data: rebuild dashboard data" && git push; fi

  # On main: confirm the merged data is valid (no commits, so branch protection is respected).
  main-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-data.js --check
